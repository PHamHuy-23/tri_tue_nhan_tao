# Kiểm tra mỗi khi push — giúp phát hiện lỗi trước khi deploy
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Nếu repo root là Visualization, đổi working-directory thành .
defaults:
  run:
    working-directory: Visualization

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: python backend/test_logic.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Visualization/frontend/package-lock.json
      - run: npm ci
        working-directory: Visualization/frontend
        continue-on-error: true
      - run: npm install && npm run build
        working-directory: Visualization/frontend
