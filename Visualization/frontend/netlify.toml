# Base directory trên Netlify UI: Visualization/frontend
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# TÙY CHỌN — nếu KHÔNG dùng VITE_API_URL, bỏ comment và thay URL Render:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-SERVICE.onrender.com/api/:splat"
#   status = 200
#   force = true
